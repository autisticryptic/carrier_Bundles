name: Build catalog set

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      accept_google_terms:
        description: I reviewed the Google Factory Images terms
        required: true
        default: false
        type: boolean
      pixel_build_id:
        description: Exact global Pixel build ID (blank uses latest global row)
        required: false
        default: CP2A.260805.005
        type: string
      ios_version:
        description: Exact iOS version/build (blank uses latest signed IPSW)
        required: false
        default: latest
        type: string
      release_tag:
        description: Release tag; blank uses the default v7 tag
        required: false
        default: v0.3.0-catalog-v7
        type: string
      xiaomi_rom_url:
        description: Xiaomi fastboot ROM URL for baseband inventory
        required: false
        default: https://bigota.d.miui.com/OS3.0.301.0.WOAMIXM/xuanyuan_global_images_OS3.0.301.0.WOAMIXM_20260428.0000.00_16.0_global_d98a2e098d.tgz
        type: string
      xiaomi_rom_md5:
        description: Xiaomi fastboot ROM MD5; blank disables MD5 verification
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: build-catalog-set-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixel:
    name: Pixel 10 Pro XL
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Require Factory Images acknowledgement
        if: ${{ github.event_name != 'push' && inputs.accept_google_terms != true }}
        run: |
          echo "Review https://developers.google.com/android/images and enable the acknowledgement." >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install Pixel extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends p7zip-full
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h
      - name: Build Pixel 10 Pro XL catalog
        run: |
          set -o pipefail
          build_variant() {
            local suffix="$1"
            shift
            local output="$RUNNER_TEMP/carrier-bundles-pixel-mustang-${suffix}.sqlite3"
            args=(--device mustang --device-name "Pixel 10 Pro XL" --build-id "${{ inputs.pixel_build_id || 'CP2A.260805.005' }}" --accept-google-terms --output "$output" "$@")
            python3 -u android/pixel/build_catalog.py "${args[@]}" --work-dir "$GITHUB_WORKSPACE/data/tmp/pixel/mustang" 2>&1 | tee "$RUNNER_TEMP/pixel-${suffix}-build.log"
            python3 tools/verify_catalog.py "$output" > "$RUNNER_TEMP/pixel-${suffix}-summary.json"
            sha256sum "$output" > "$RUNNER_TEMP/SHA256SUMS-pixel-${suffix}"
          }
          build_variant no-icons --skip-icon-sync
          build_variant with-icons
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: catalog-pixel-mustang
          path: |
            ${{ runner.temp }}/carrier-bundles-pixel-mustang-*.sqlite3
            ${{ runner.temp }}/pixel-*-summary.json
            ${{ runner.temp }}/SHA256SUMS-pixel-*
            ${{ runner.temp }}/pixel-*-build.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  ios:
    name: iOS iPhone17,2
    # The complete build is intentionally performed by GitHub Actions. The
    # runner needs enough free disk for the IPSW/AEA/APFS temporary files.
    runs-on: macos-14
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install iOS extraction tools
        run: |
          brew install go rust cmake p7zip || true
          df -h
      - name: Build and verify iOS catalog
        run: |
          set -o pipefail
          product_type="iPhone17,2"
          source_metadata="$RUNNER_TEMP/${product_type}-source.txt"
          python3 - "$product_type" "${{ inputs.ios_version || 'latest' }}" > "$source_metadata" <<'PY'
          import sys
          from ios.sources import catalog_filename, resolve_ipsw_artifact

          artifact = resolve_ipsw_artifact(sys.argv[1], sys.argv[2])
          print(artifact.build_id)
          print(catalog_filename(artifact))
          PY
          resolved_build=$(sed -n '1p' "$source_metadata")
          base_output_name=$(sed -n '2p' "$source_metadata")
          work_dir="$GITHUB_WORKSPACE/data/tmp/ios/${product_type}"
          mkdir -p "$work_dir"
          build_variant() {
            local suffix="$1"
            shift
            local output_name="${base_output_name%.sqlite3}-${suffix}.sqlite3"
            local output="$RUNNER_TEMP/$output_name"
            args=(--product-type "$product_type" --version "$resolved_build" --work-dir "$work_dir" --output "$output" "$@")
            python3 -u ios/build_catalog.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/${product_type}-${suffix}-build.log"
            python3 tools/verify_catalog.py "$output" > "$RUNNER_TEMP/${product_type}-${suffix}-summary.json"
            shasum -a 256 "$output" > "$RUNNER_TEMP/SHA256SUMS-${product_type}-${suffix}"
          }
          build_variant no-icons --skip-icon-sync
          reuse_args=(--bundle-root "$work_dir/carrier-extract")
          baseband_path=$(find "$work_dir/outer" -type f -name '*.bbfw' -print -quit)
          if [[ -n "$baseband_path" ]]; then
            reuse_args+=(--baseband "$baseband_path")
          fi
          if [[ -d "$work_dir/carrier-extract" ]]; then
            build_variant with-icons "${reuse_args[@]}"
          else
            build_variant with-icons
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: catalog-iPhone17,2
          path: |
            ${{ runner.temp }}/carrier-bundles-iphone*.sqlite3
            ${{ runner.temp }}/iPhone17,2-*-summary.json
            ${{ runner.temp }}/SHA256SUMS-iPhone17,2-*
            ${{ runner.temp }}/iPhone17,2-*-build.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  ipcc:
    name: iOS Apple IPCC
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build and verify Apple IPCC catalog
        run: |
          set -o pipefail
          build_variant() {
            local suffix="$1"
            shift
            local output="$RUNNER_TEMP/carrier-bundles-ios-ipcc-${suffix}.sqlite3"
            args=(
              --workers 12
              --work-dir "$GITHUB_WORKSPACE/data/tmp/ipcc-catalog"
              --output "$output"
              "$@"
            )
            python3 -u ios/build_ipcc_catalog.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/ipcc-${suffix}-build.log"
            python3 tools/verify_catalog.py "$output" > "$RUNNER_TEMP/ipcc-${suffix}-summary.json"
            cp "$GITHUB_WORKSPACE/data/tmp/ipcc-catalog/manifest.json" "$RUNNER_TEMP/ipcc-${suffix}-manifest.json"
            sha256sum "$output" > "$RUNNER_TEMP/SHA256SUMS-ipcc-${suffix}"
          }
          build_variant no-icons --skip-icon-sync
          build_variant with-icons
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: catalog-ios-ipcc
          path: |
            ${{ runner.temp }}/carrier-bundles-ios-ipcc-*.sqlite3
            ${{ runner.temp }}/ipcc-*-summary.json
            ${{ runner.temp }}/ipcc-*-manifest.json
            ${{ runner.temp }}/SHA256SUMS-ipcc-*
            ${{ runner.temp }}/ipcc-*-build.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  xiaomi:
    name: Xiaomi 15 Ultra baseband
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build and verify Xiaomi baseband catalog
        run: |
          set -o pipefail
          build_variant() {
            local suffix="$1"
            shift
            local output="$RUNNER_TEMP/carrier-bundles-xiaomi15ultra-xuanyuan-baseband-${suffix}.sqlite3"
            args=(
              --rom-url "${{ inputs.xiaomi_rom_url || 'https://bigota.d.miui.com/OS3.0.301.0.WOAMIXM/xuanyuan_global_images_OS3.0.301.0.WOAMIXM_20260428.0000.00_16.0_global_d98a2e098d.tgz' }}"
              --rom-md5 "${{ inputs.xiaomi_rom_md5 || '' }}"
              --output "$output"
              "$@"
            )
            python3 -u android/xiaomi/build_baseband_catalog.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/xiaomi-baseband-${suffix}-build.log"
            python3 tools/verify_catalog.py "$output" > "$RUNNER_TEMP/xiaomi-baseband-${suffix}-summary.json"
            sha256sum "$output" > "$RUNNER_TEMP/SHA256SUMS-xiaomi-baseband-${suffix}"
          }
          build_variant no-icons --skip-icon-sync
          build_variant with-icons
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: catalog-xiaomi-baseband
          path: |
            ${{ runner.temp }}/carrier-bundles-xiaomi15ultra-xuanyuan-baseband-*.sqlite3
            ${{ runner.temp }}/xiaomi-baseband-*-summary.json
            ${{ runner.temp }}/SHA256SUMS-xiaomi-baseband-*
            ${{ runner.temp }}/xiaomi-baseband-*-build.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  aggregate:
    needs: [pixel, ios, ipcc, xiaomi]
    if: ${{ always() && (needs.pixel.result == 'success' || needs.ios.result == 'success' || needs.ipcc.result == 'success' || needs.xiaomi.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: catalog-*
          path: catalog-set
          merge-multiple: true
      - name: Make aggregate checksums and summary
        env:
          PIXEL_RESULT: ${{ needs.pixel.result }}
          IOS_IPSW_RESULT: ${{ needs.ios.result }}
          IOS_IPCC_RESULT: ${{ needs.ipcc.result }}
          XIAOMI_BASEBAND_RESULT: ${{ needs.xiaomi.result }}
        run: |
          find catalog-set -type f -name '*.sqlite3' -print0 | sort -z | xargs -0 sha256sum > catalog-set/SHA256SUMS
          {
            echo '# Catalog set'
            echo
            echo "Built by run $GITHUB_RUN_ID. Each SQLite is an independent schema-v7 catalog."
            echo
            echo '| Source | Result |'
            echo '|---|---|'
            echo "| Pixel 10 Pro XL ROM (with-icons/no-icons) | $PIXEL_RESULT |"
            echo "| iPhone 16 Pro Max IPSW (with-icons/no-icons) | $IOS_IPSW_RESULT |"
            echo "| Apple online IPCC index (with-icons/no-icons) | $IOS_IPCC_RESULT |"
            echo "| Xiaomi 15 Ultra fastboot baseband inventory (with-icons/no-icons) | $XIAOMI_BASEBAND_RESULT |"
            echo
            echo 'A failed source is not merged into another database; successful catalogs remain publishable.'
          } > catalog-set/BUILD_STATUS.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carrier-bundles-catalog-set-${{ github.run_id }}
          path: catalog-set
          compression-level: 0
          retention-days: 30
      - name: Remove assets from the previous catalog set
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.3.0-catalog-v7' }}
        with:
          script: |
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                per_page: 100,
              },
            );
            for (const asset of assets) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }
      - name: Publish schema-v7 catalog Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: ${{ inputs.release_tag || 'v0.3.0-catalog-v7' }}
          name: Carrier Bundles v0.3.0 schema v7
          target_commitish: ${{ github.sha }}
          body_path: catalog-set/BUILD_STATUS.md
          files: catalog-set/*
          fail_on_unmatched_files: true
          preserve_order: true
