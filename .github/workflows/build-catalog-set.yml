name: Build catalog set

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      accept_google_terms:
        description: I reviewed the Google Factory Images terms
        required: true
        default: false
        type: boolean
      pixel_build_id:
        description: Exact global Pixel build ID (blank uses latest global row)
        required: false
        default: CP2A.260805.005
        type: string
      ios_version:
        description: Exact iOS version/build (blank uses latest signed IPSW)
        required: false
        default: latest
        type: string
      release_tag:
        description: Release tag; blank uses the default v7 tag
        required: false
        default: v0.3.0-catalog-v7
        type: string

permissions:
  contents: write

jobs:
  pixel:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Require Factory Images acknowledgement
        if: ${{ github.event_name != 'push' && inputs.accept_google_terms != true }}
        run: |
          echo "Review https://developers.google.com/android/images and enable the acknowledgement." >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install Pixel extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends p7zip-full
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h
      - name: Build Pixel 10 Pro XL catalog
        run: |
          args=(--device mustang --device-name "Pixel 10 Pro XL" --build-id "${{ inputs.pixel_build_id || 'CP2A.260805.005' }}" --accept-google-terms --output "$RUNNER_TEMP/carrier-bundles-pixel-mustang.sqlite3")
          python3 android/pixel/build_catalog.py "${args[@]}" --work-dir "$GITHUB_WORKSPACE/data/tmp/pixel/mustang"
          python3 tools/verify_catalog.py "$RUNNER_TEMP/carrier-bundles-pixel-mustang.sqlite3" > "$RUNNER_TEMP/pixel-summary.json"
          sha256sum "$RUNNER_TEMP/carrier-bundles-pixel-mustang.sqlite3" > "$RUNNER_TEMP/SHA256SUMS-pixel"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-pixel-mustang
          path: |
            ${{ runner.temp }}/carrier-bundles-pixel-mustang.sqlite3
            ${{ runner.temp }}/pixel-summary.json
            ${{ runner.temp }}/SHA256SUMS-pixel
          compression-level: 0
          retention-days: 14

  ios:
    name: iOS ${{ matrix.product_type }}
    strategy:
      fail-fast: false
      matrix:
        product_type: ["iPhone17,2"]
    # The complete build is intentionally performed by GitHub Actions. The
    # runner needs enough free disk for the IPSW/AEA/APFS temporary files.
    runs-on: macos-14
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install iOS extraction tools
        run: |
          brew install go rust cmake p7zip || true
          df -h
      - name: Build and verify iOS catalog
        run: |
          set -o pipefail
          output="$RUNNER_TEMP/carrier-bundles-${{ matrix.product_type }}.sqlite3"
          mkdir -p "$GITHUB_WORKSPACE/data/tmp/ios/${{ matrix.product_type }}"
          python3 -u ios/build_catalog.py --product-type "${{ matrix.product_type }}" --version "${{ inputs.ios_version || 'latest' }}" --work-dir "$GITHUB_WORKSPACE/data/tmp/ios/${{ matrix.product_type }}" --output "$output" 2>&1 | tee "$RUNNER_TEMP/${{ matrix.product_type }}-build.log"
          python3 tools/verify_catalog.py "$output" > "$RUNNER_TEMP/${{ matrix.product_type }}-summary.json"
          shasum -a 256 "$output" > "$RUNNER_TEMP/SHA256SUMS-${{ matrix.product_type }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: catalog-${{ matrix.product_type }}
          path: |
            ${{ runner.temp }}/carrier-bundles-${{ matrix.product_type }}.sqlite3
            ${{ runner.temp }}/${{ matrix.product_type }}-summary.json
            ${{ runner.temp }}/SHA256SUMS-${{ matrix.product_type }}
            ${{ runner.temp }}/${{ matrix.product_type }}-build.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  ipcc:
    name: iOS Apple IPCC
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build and verify Apple IPCC catalog
        run: |
          set -o pipefail
          output="$RUNNER_TEMP/carrier-bundles-ios-ipcc.sqlite3"
          python3 -u ios/build_ipcc_catalog.py \
            --workers 12 \
            --work-dir "$GITHUB_WORKSPACE/data/tmp/ipcc-catalog" \
            --output "$output" 2>&1 | tee "$RUNNER_TEMP/ipcc-build.log"
          python3 tools/verify_catalog.py "$output" > "$RUNNER_TEMP/ipcc-summary.json"
          cp "$GITHUB_WORKSPACE/data/tmp/ipcc-catalog/manifest.json" "$RUNNER_TEMP/ipcc-manifest.json"
          sha256sum "$output" > "$RUNNER_TEMP/SHA256SUMS-ipcc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: catalog-ios-ipcc
          path: |
            ${{ runner.temp }}/carrier-bundles-ios-ipcc.sqlite3
            ${{ runner.temp }}/ipcc-summary.json
            ${{ runner.temp }}/ipcc-manifest.json
            ${{ runner.temp }}/SHA256SUMS-ipcc
            ${{ runner.temp }}/ipcc-build.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  aggregate:
    needs: [pixel, ios, ipcc]
    if: ${{ always() && (needs.pixel.result == 'success' || needs.ios.result == 'success' || needs.ipcc.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: catalog-*
          path: catalog-set
          merge-multiple: true
      - name: Make aggregate checksums and summary
        env:
          PIXEL_RESULT: ${{ needs.pixel.result }}
          IOS_IPSW_RESULT: ${{ needs.ios.result }}
          IOS_IPCC_RESULT: ${{ needs.ipcc.result }}
        run: |
          find catalog-set -type f -name '*.sqlite3' -print0 | sort -z | xargs -0 sha256sum > catalog-set/SHA256SUMS
          {
            echo '# Catalog set'
            echo
            echo "Built by run $GITHUB_RUN_ID. Each SQLite is an independent schema-v7 catalog."
            echo
            echo '| Source | Result |'
            echo '|---|---|'
            echo "| Pixel 10 Pro XL ROM | $PIXEL_RESULT |"
            echo "| iPhone 16 Pro Max IPSW | $IOS_IPSW_RESULT |"
            echo "| Apple online IPCC index | $IOS_IPCC_RESULT |"
            echo
            echo 'A failed source is not merged into another database; successful catalogs remain publishable.'
          } > catalog-set/BUILD_STATUS.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carrier-bundles-catalog-set-${{ github.run_id }}
          path: catalog-set
          compression-level: 0
          retention-days: 30
      - name: Publish schema-v7 catalog Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: ${{ inputs.release_tag || 'v0.3.0-catalog-v7' }}
          name: Carrier Bundles v0.3.0 schema v7
          target_commitish: ${{ github.sha }}
          body_path: catalog-set/BUILD_STATUS.md
          files: catalog-set/*
          fail_on_unmatched_files: true
          overwrite_files: true
