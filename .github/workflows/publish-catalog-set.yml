name: Publish verified catalog set

# Only isolated catalog-set branches. No source/DB rebuild or main mutation.
on:
  push:
    branches:
      - 'release-staging/catalog-set/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-catalog-set-v0.3.1-catalog-v7
  cancel-in-progress: false

jobs:
  validate:
    if: startsWith(github.ref, 'refs/heads/release-staging/catalog-set/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.verify.outputs.publish }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run all source and publication safety tests (temporary test fixtures only)
        run: |
          python -m pip install --disable-pip-version-check -r android/pixel/requirements.txt
          python -B -m unittest discover -s tests -v
      - name: Verify exact prebuilt artifact, twelve read-only DBs and unused tag
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/publish_catalog_set.py validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-publication-validation-${{ github.run_id }}
          path: publication-proof.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reverify, create NEW draft, upload exact assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/publish_catalog_set.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-publication-proof-${{ github.run_id }}
          path: publication-proof.json
          if-no-files-found: error
          retention-days: 30
